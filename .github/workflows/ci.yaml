name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  HUSKY: 0

jobs:
  format:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Validate pushed commit
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - run: npm run format

      - name: Verify formatting
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Commit formatted files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format files"
          git push

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: format
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - uses: denoland/setup-deno@v2

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm test

      - run: npm run bench

      - name: Generate README results from this CI run
        run: npm run reports:ci

      - name: Upload test, coverage, and benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bytecodec-reports
          include-hidden-files: true
          path: |
            README.md
            test/.results/
            benchmark/.results/
            coverage/
            test-results/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Commit generated README results
        if: github.event_name == 'push'
        env:
          TESTED_SHA: ${{ needs.format.outputs.sha }}
        run: |
          current_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$current_sha" != "$TESTED_SHA" ]; then
            echo "master advanced during this run; results remain available in the artifact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: update CI test and benchmark results"
          git push origin HEAD:master

  release-please:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  publish:
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build:package

      - name: Sync jsr.json version from package.json
        run: |
          node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const jsr=JSON.parse(fs.readFileSync('jsr.json','utf8')); jsr.version=pkg.version; fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');"

      - name: Commit JSR version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jsr.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync JSR version"
          git push

      - run: npm publish --access public --ignore-scripts

      - name: Publish to JSR
        run: npx jsr publish
